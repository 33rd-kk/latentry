# Gives the container your NVIDIA GPUs, for Latentry's engine. Needs the
# NVIDIA Container Toolkit (on Windows, Docker Desktop with WSL 2 and a
# current NVIDIA driver). Use it on top of compose.yaml:
#
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d --build

services:
  latentry:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
