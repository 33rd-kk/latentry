site_name: Latentry
site_description: Private, local image generation. Every picture remembered. The manual.
site_url: https://33rd-kk.github.io/latentry/
repo_url: https://github.com/33rd-kk/latentry
repo_name: 33rd-kk/latentry
edit_uri: edit/main/docs/
copyright: Latentry is MIT. Models keep their own licences.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Install:
      - From source: install/native.md
  - Generate:
      - The generate page: guide/generate.md
      - From a picture: guide/from-a-picture.md
      - Bigger pictures: guide/bigger.md
      - Many pictures: guide/many.md
      - Pose and the 3D view: guide/pose.md
  - Gallery: guide/gallery.md
  - Devices:
      - Owner device: guide/owner-device.md
      - Other devices and security: guide/network.md
  - Privacy and security:
      - Privacy: guide/privacy.md
      - Secret mode: guide/secret-mode.md
      - What it protects against: guide/threat-model.md
  - Settings and Setup:
      - Setup and the engine: guide/engine.md
      - Settings: guide/settings.md
  - Reference:
      - Configuration: reference/configuration.md
      - Backends: reference/backends.md
      - Backend API: backend-api.md
      - Compatibility: reference/compatibility.md
      - Support: reference/support.md
      - LIGSP conformance: reference/ligsp.md
      - Troubleshooting: reference/troubleshooting.md
  - Changelog: changelog.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

exclude_docs: |
  requirements.txt
