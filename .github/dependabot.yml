# Keeps dependencies current: security fixes as they are published, other
# bumps weekly. Minor and patch updates come grouped, one pull request per
# ecosystem; each major update comes on its own, so one that breaks (say,
# a TypeScript the lint config does not support yet) holds up nothing else.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Node's types follow the Node.js Latentry supports (22), not the newest.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7.0 ships no JavaScript API (7.1 is to bring a new one), and
      # typescript-eslint, ts-node (npm test, e2e) and Next.js all need one.
      # Remove this once they run on TypeScript 7.
      - dependency-name: typescript
        versions: [">= 7"]
  # The engine's packages are pinned in engine/locks/ by scripts/lock-engine.mjs,
  # which keeps PyTorch's build tags (+cu130) and each CUDA build's own torch.
  # Dependabot rewrites those files without either, so it opens no version
  # updates here: the monthly "Engine lock refresh" workflow does (run it by
  # hand for a security fix). A Dependabot security update that edits
  # engine/locks/ fails CI; close it and run that workflow instead.
  - package-ecosystem: pip
    directory: /engine
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    groups:
      lint:
        patterns: ["*"]
    ignore:
      # uv follows lib/engine/uv-release.ts (scripts/pin-downloads.mjs uv), together.
      - dependency-name: uv
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
