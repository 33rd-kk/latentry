# Keeps dependencies current: security fixes as they are published, other
# bumps weekly. Minor and patch updates come grouped, one pull request per
# ecosystem; each major update comes on its own, so one that breaks (say,
# a TypeScript the lint config does not support yet) holds up nothing else.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Node's types follow the Node.js Latentry supports (22), not the newest.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: pip
    directory: /engine
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
