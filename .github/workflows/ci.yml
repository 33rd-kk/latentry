name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22 is the oldest Node.js Latentry supports (package.json engines);
        # 24 (LTS) and 26 (the newest) are checked too, on one OS, so a newer
        # Node cannot break unseen.
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
    name: web (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Every UI string has an English source and no catalog is broken.
      - run: npm run i18n:check
      # The verify scripts in __tests__/: no backend, GPU or model needed.
      # Once with coverage, printed in the log only (nothing is uploaded).
      - if: matrix.os != 'ubuntu-latest' || matrix.node != 22
        run: npm test
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run coverage
      # A production build, once: what `npm start` serves must compile.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run build

  # The browser tests in e2e/: a production build against a mock A1111 web
  # UI, in Playwright's Chromium. Once, on one OS.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Only mock pictures and the test's own pages are in it.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            .github/requirements-lint.txt
      - run: python -m compileall -q engine/latentry_engine
      # ruff, pinned, with its default rules (engine/pyproject.toml), and the pinned uv.
      - run: python -m pip install -r .github/requirements-lint.txt
      - run: ruff check engine
      # The lock files match engine/pyproject.toml and engine/locks/torch.in,
      # and every hash in them is what the index serves (fetched again).
      - run: node scripts/lock-engine.mjs --check
        env:
          LATENTRY_UV: uv
      # engine/tests: what can be checked without a GPU or a model (the models
      # folder, the GPU plan, the HTTP API's token and input checks), on the
      # packages an install gets: the CPU lock, every file checked against its
      # hash, as lib/engine/install.ts does. poseorbit is tested in its own repository.
      - run: uv venv --python 3.12 /tmp/engine
      - run: uv pip sync --python /tmp/engine --require-hashes --torch-backend cpu engine/locks/linux-x86_64-cpu.txt
      - run: uv pip install --python /tmp/engine --no-deps -e engine
      - run: uv pip install --python /tmp/engine pytest httpx
      - run: /tmp/engine/bin/python -m pytest engine/tests -q -p no:cacheprovider
