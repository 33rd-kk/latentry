name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22 is the oldest Node.js Latentry supports (package.json engines);
        # 24 is checked too, on one OS, so a newer Node cannot break unseen.
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    name: web (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Every UI string has an English source and no catalog is broken.
      - run: npm run i18n:check
      # The verify scripts in __tests__/: no backend, GPU or model needed.
      - run: npm test
      # A production build, once: what `npm start` serves must compile.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            .github/requirements-lint.txt
      - run: python -m compileall -q engine/latentry_engine
      # ruff, pinned, with its default rules (engine/pyproject.toml).
      - run: python -m pip install -r .github/requirements-lint.txt
      - run: ruff check engine
      # engine/tests: what can be checked without a GPU or a model (the models
      # folder, the GPU plan, the HTTP API's token and input checks). PyTorch
      # comes from its CPU index; poseorbit is tested in its own repository.
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e engine pytest httpx
      - run: python -m pytest engine/tests -q -p no:cacheprovider
