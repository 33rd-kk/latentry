# The files of a release: the source at the release's tag as .tar.gz and .zip,
# their SHA256SUMS, and a build provenance attestation for each archive, so
# anyone can check that a download was made here, by this workflow, from that
# commit:
#
#   gh attestation verify latentry-X.Y.Z.tar.gz --repo 33rd-kk/latentry
#
# Runs when a release is published, and by hand for an earlier release.
name: Release files

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, e.g. v0.8.0"
        required: true

permissions:
  contents: read

jobs:
  files:
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the files to the release
      id-token: write # sign the attestations
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Not a release tag: $TAG" >&2; exit 1 ;;
          esac
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          git checkout --detach "refs/tags/$TAG"
          # Only a commit already on main is released.
          git merge-base --is-ancestor HEAD origin/main || { echo "$TAG is not on main" >&2; exit 1; }
          actual="$(node -p 'require("./package.json").version')"
          [ "$actual" = "$version" ] || { echo "package.json says $actual, the tag $version" >&2; exit 1; }

      - name: Make the archives and SHA256SUMS
        run: |
          mkdir dist
          name="latentry-$VERSION"
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" HEAD
          git archive --format=zip --prefix="$name/" -o "dist/$name.zip" HEAD
          (cd dist && sha256sum "$name.tar.gz" "$name.zip" > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
