# What a release publishes, each with a build provenance attestation, so
# anyone can check that it was made here, by this workflow, from that commit:
#
# - the source at the release's tag as .tar.gz and .zip, with SHA256SUMS:
#
#     gh attestation verify latentry-X.Y.Z.tar.gz --repo 33rd-kk/latentry --source-ref refs/tags/vX.Y.Z
#
# - the container image ghcr.io/33rd-kk/latentry:X.Y.Z, for amd64 and arm64:
#
#     gh attestation verify oci://ghcr.io/33rd-kk/latentry:X.Y.Z --repo 33rd-kk/latentry --source-ref refs/tags/vX.Y.Z
#
#   Each platform is built on its own runner and checked by
#   scripts/docker-smoke.sh before the version's tag is put on them, so a
#   broken image never gets a version. The image has no `latest` tag:
#   compose.yaml names the version it was released with.
#
# A run by hand records main as its source instead of the tag.
#
# Runs when a release is published, and by hand for an earlier release.
name: Release files

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, e.g. v0.8.0"
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/33rd-kk/latentry

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: check
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Not a release tag: $TAG" >&2; exit 1 ;;
          esac
          version="${TAG#v}"
          git checkout --detach "refs/tags/$TAG"
          # Only a commit already on main is released.
          git merge-base --is-ancestor HEAD origin/main || { echo "$TAG is not on main" >&2; exit 1; }
          actual="$(node -p 'require("./package.json").version')"
          [ "$actual" = "$version" ] || { echo "package.json says $actual, the tag $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  files:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the files to the release
      id-token: write # sign the attestations
      attestations: write
    env:
      TAG: v${{ needs.tag.outputs.version }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false

      - name: Make the archives and SHA256SUMS
        run: |
          mkdir dist
          name="latentry-$VERSION"
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" HEAD
          git archive --format=zip --prefix="$name/" -o "dist/$name.zip" HEAD
          (cd dist && sha256sum "$name.tar.gz" "$name.zip" > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # One platform's image, pushed by its digest only (no tag yet), then pulled
  # back and checked on that platform.
  image-build:
    needs: tag
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push to ghcr.io
    env:
      VERSION: ${{ needs.tag.outputs.version }}
      REVISION: ${{ needs.tag.outputs.sha }}
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push by digest
        run: |
          docker buildx create --use --name release
          docker buildx build . \
            --platform "$PLATFORM" \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$REVISION" \
            --provenance=false --sbom=false \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          case "$digest" in sha256:*) ;; *) echo "No digest: $digest" >&2; exit 1 ;; esac
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          mkdir -p digests
          echo "$digest" > "digests/$ARCH"

      - name: Check the pushed image
        run: LATENTRY_IMAGE="$IMAGE@$DIGEST" scripts/docker-smoke.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          retention-days: 1

  # The version's tag on both platforms' images, and its attestation.
  image:
    needs: [tag, image-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # tag the image, push the attestation
      id-token: write # sign the attestation
      attestations: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Tag the version
        run: |
          refs=()
          for arch in amd64 arm64; do refs+=("$IMAGE@$(cat "digests/$arch")"); done
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --annotation "index:org.opencontainers.image.source=https://github.com/33rd-kk/latentry" \
            --annotation "index:org.opencontainers.image.description=Latentry, a local image generation hub" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$digest" in sha256:*) ;; *) echo "No digest: $digest" >&2; exit 1 ;; esac
          echo "DIGEST=$digest" >> "$GITHUB_ENV"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
