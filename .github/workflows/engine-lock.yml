# Proposes newer pinned Python packages for the engine once a month: moves
# LOCKED_ON (lib/engine/locks.ts) to today, makes engine/locks/ again with
# --upgrade, and opens a pull request when anything changed. Security fixes
# reach users only through a new lock, so this keeps one waiting even when
# nobody is looking; it changes nothing on main by itself.
#
# Pull requests opened with GITHUB_TOKEN start no workflows of their own:
# close and reopen it (or push to it) to run CI and the audit before merging.
# It needs "Allow GitHub Actions to create and approve pull requests" in the
# repository's Actions settings.
name: Engine lock refresh

on:
  schedule:
    - cron: "41 4 1 * *" # the 1st of each month, 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: python -m pip install -r .github/requirements-lint.txt
      - name: Lock again for today
        id: lock
        run: |
          today=$(date -u +%F)
          sed -i -E "s/^export const LOCKED_ON = '[0-9-]+'/export const LOCKED_ON = '$today'/" lib/engine/locks.ts
          LATENTRY_UV=uv node scripts/lock-engine.mjs --upgrade
          echo "today=$today" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- engine/locks; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Open a pull request
        if: steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TODAY: ${{ steps.lock.outputs.today }}
        run: |
          branch="engine-lock/$TODAY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add lib/engine/locks.ts engine/locks
          git commit -m "Pin the engine's Python packages as of $TODAY"
          git push origin "$branch"
          {
            echo "Newer pinned Python packages for the engine, resolved for $TODAY by \`scripts/lock-engine.mjs --upgrade\`."
            echo
            echo "Before merging: read the version changes in \`engine/locks/\`, close and reopen this pull request so CI and the dependency audit run, and add a line under Unreleased in CHANGELOG.md (users run Repair / update to get them)."
          } > /tmp/body.md
          gh pr create --title "Pin the engine's Python packages as of $TODAY" --body-file /tmp/body.md --head "$branch" --base main
