# CI on macOS (Apple silicon), where the engine runs on Metal. macOS minutes
# count ten times Linux's, so this runs after a merge, once a week and on
# demand, not on every pull request: a break here shows up after the merge,
# not before it.
name: CI (macOS)

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2" # Tuesdays 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            .github/requirements-lint.txt
      - run: python -m pip install -r .github/requirements-lint.txt
      # The Apple silicon lock, as an install gets it: PyPI's torch, which is
      # the Metal (MPS) build, every file checked against its hash. The tests need no GPU.
      - run: uv venv --python 3.12 /tmp/engine
      - run: uv pip sync --python /tmp/engine --require-hashes engine/locks/macos-arm64.txt
      - run: uv pip install --python /tmp/engine --no-deps -e engine
      - run: uv pip install --python /tmp/engine pytest httpx
      - run: /tmp/engine/bin/python -m pytest engine/tests -q -p no:cacheprovider
