# CI on macOS (Apple silicon), where the engine runs on Metal. macOS minutes
# count ten times Linux's, so this runs after a merge, once a week and on
# demand, not on every pull request: a break here shows up after the merge,
# not before it.
name: CI (macOS)

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2" # Tuesdays 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      # macOS wheels on PyPI are the Metal (MPS) build; the tests need no GPU.
      - run: python -m pip install torch
      - run: python -m pip install -e engine pytest httpx
      - run: python -m pytest engine/tests -q -p no:cacheprovider
