# The documentation site (mkdocs.yml, docs/) on GitHub Pages:
# https://33rd-kk.github.io/latentry/. Rebuilt when the manual (or what it
# includes: CHANGELOG.md, .env.example) changes on main, or by hand.
name: Docs

on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, CHANGELOG.md, .env.example, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml, CHANGELOG.md, .env.example, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r docs/requirements.txt
      # --strict: a broken link or reference fails the build.
      - run: mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    # Pull requests only check that the site builds.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
