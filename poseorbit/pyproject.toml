[project]
name = "poseorbit"
version = "0.1.0"
description = "Find the people in a picture, turn their pose in 3D, and draw the skeleton a pose-conditioned image model follows."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "33rd-kk" }]
requires-python = ">=3.10"
# CPU only, no torch: rtmlib brings OpenCV, onnxruntime runs the models.
dependencies = [
    "rtmlib>=0.0.16",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "pillow>=10",
    "huggingface_hub>=0.30",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
test = ["pytest>=8"]

[project.scripts]
poseorbit = "poseorbit.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poseorbit"]
