[project]
name = "poseorbit"
version = "0.1.0"
description = "Find the people in a picture, turn their pose in 3D, and draw the skeleton a pose-conditioned image model follows."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "33rd-kk" }]
requires-python = ">=3.10"
keywords = ["pose", "openpose", "dwpose", "controlnet", "skeleton", "3d", "stable-diffusion", "rtmlib"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# CPU only, no torch: rtmlib brings OpenCV, onnxruntime runs the models.
dependencies = [
    "rtmlib>=0.0.16",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "pillow>=10",
    "huggingface_hub>=0.30",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/33rd-kk/poseorbit"
Issues = "https://github.com/33rd-kk/poseorbit/issues"
Changelog = "https://github.com/33rd-kk/poseorbit/blob/main/CHANGELOG.md"

[project.scripts]
poseorbit = "poseorbit.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poseorbit"]

[tool.hatch.build.targets.sdist]
# The README's pictures and the banner script stay in the repository only.
exclude = ["docs", "scripts", ".github"]
