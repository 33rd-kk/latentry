[project]
name = "latentry-engine"
version = "0.6.1"
description = "Latentry's generation engine: stock diffusers behind the small HTTP API Latentry speaks."
license = "MIT"
requires-python = ">=3.10,<3.14"
# torch is installed separately, from the PyTorch index that matches the GPU
# (CUDA, ROCm, or CPU): Latentry's engine manager picks it.
dependencies = [
    "diffusers>=0.40,<0.42",
    "transformers>=4.46",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.30",
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=10",
    "numpy>=1.26",
    # Pose control: poseorbit (PyPI; https://github.com/33rd-kk/poseorbit)
    # finds people and draws skeletons; below 0.3 while its API may still
    # change between minor versions. peft loads Anima's pose LoRA.
    # 0.2.0 draws some of the people by a list (and pins its downloads, as 0.1.2 did).
    "poseorbit>=0.2.0,<0.3",
    "peft>=0.15",
    # torch comes from PyTorch's index, which carries an old setuptools
    # (78.1, with known path-traversal advisories); this pulls a fixed one
    # from PyPI when the engine itself is installed.
    "setuptools>=83",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["latentry_engine"]

# Lint (CI runs the ruff pinned in .github/requirements-lint.txt, with its
# default rules): the oldest Python the engine supports.
[tool.ruff]
target-version = "py310"
