[project]
name = "latentry-engine"
version = "0.1.0"
description = "Latentry's generation engine: stock diffusers behind the small HTTP API Latentry speaks."
license = "MIT"
requires-python = ">=3.10,<3.14"
# torch is installed separately, from the PyTorch index that matches the GPU
# (CUDA, ROCm, or CPU): Latentry's engine manager picks it.
dependencies = [
    "diffusers>=0.40,<0.42",
    "transformers>=4.46",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.30",
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=10",
    "numpy>=1.26",
    # Pose control: poseorbit (PyPI; https://github.com/33rd-kk/poseorbit)
    # finds people and draws skeletons; below 0.2 while its API may still
    # change between minor versions. peft loads Anima's pose LoRA.
    "poseorbit>=0.1.1,<0.2",
    "peft>=0.15",
    # torch comes from PyTorch's index, which carries an old setuptools
    # (78.1, with known path-traversal advisories); this pulls a fixed one
    # from PyPI when the engine itself is installed.
    "setuptools>=83",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["latentry_engine"]
